# public/admin/config.yml
backend:
  name: git-gateway
  branch: main

media_folder: "public/img/ressources"
public_folder: "/img/ressources"

collections:
  - name: "ressources"
    label: "Articles"
    folder: "src/content/ressources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image de couverture", name: "image", widget: "image", required: false }
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Serious game"
          - "Jeu vidéo"
          - "Gamification"
          - "Escape game"
          - "Événementiel"
          - "Culture"
          - "Éducation"
          - "Associatif"
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false }
      - { label: "Contenu", name: "body", widget: "markdown" }