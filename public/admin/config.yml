backend:
  name: git-gateway
  branch: main

media_folder: "public/img/ressources"
public_folder: "/img/ressources"

collections:
  - name: "ressources"
    label: "Articles"
    folder: "src/content/ressources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image de couverture", name: "image", widget: "image", required: false }
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Serious game"
          - "Jeu vidéo"
          - "Gamification"
          - "Escape game"
          - "Événementiel"
          - "Culture"
          - "Éducation"
          - "Associatif"
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false }

      - label: "Blocs de contenu"
        name: "blocks"
        widget: "list"
        required: false
        types:
          - label: "Bloc 1 — Titre + texte (1 colonne)"
            name: "text_single"
            widget: "object"
            fields:
              - { label: "Titre du bloc", name: "heading", widget: "string" }
              - { label: "Texte", name: "text", widget: "markdown" }

          - label: "Bloc 2 — Titre + image + texte"
            name: "image_text"
            widget: "object"
            fields:
              - { label: "Titre du bloc", name: "heading", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Légende de l'image", name: "imageLegend", widget: "string", required: false }
              - { label: "Texte", name: "text", widget: "markdown" }
              - label: "Position de l'image"
                name: "imagePosition"
                widget: "select"
                options: ["gauche", "droite"]
                default: "gauche"

          - label: "Bloc 3 — Titre + texte (2 colonnes)"
            name: "text_two_columns"
            widget: "object"
            fields:
              - { label: "Titre du bloc", name: "heading", widget: "string" }
              - { label: "Colonne 1", name: "column1", widget: "markdown" }
              - { label: "Colonne 2", name: "column2", widget: "markdown" }

          - label: "Bloc 4 — Titre + image pleine largeur + texte"
            name: "full_image_text"
            widget: "object"
            fields:
              - { label: "Titre du bloc", name: "heading", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Légende de l'image", name: "imageLegend", widget: "string", required: false }
              - { label: "Texte", name: "text", widget: "markdown" }

          - label: "Bloc 5 — Titre + texte (3 colonnes)"
            name: "text_three_columns"
            widget: "object"
            fields:
              - { label: "Titre du bloc", name: "heading", widget: "string" }
              - { label: "Colonne 1", name: "column1", widget: "markdown" }
              - { label: "Colonne 2", name: "column2", widget: "markdown" }
              - { label: "Colonne 3", name: "column3", widget: "markdown" }

          - label: "Bloc 6 — FAQ"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Titre de la FAQ", name: "heading", widget: "string", default: "Des questions ?" }
              - label: "Questions"
                name: "items"
                widget: "list"
                label_singular: "Question"
                summary: "{{fields.question}}"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Réponse", name: "answer", widget: "markdown" }