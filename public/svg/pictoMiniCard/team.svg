<svg class="ico ico-team" width="145" height="161" viewBox="0 0 145 161" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="overflow:visible">
<style>
@keyframes team-gear { to { transform: rotate(360deg); } }
@keyframes team-bob { 0%,100% { transform: none; } 50% { transform: translateY(-4px); } }
@keyframes team-link { 0% { stroke-dashoffset: 1; } 35%,80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }

:is(.mini-card,.revers-mini-card):hover .ico-team .team-gear { transform-origin: 72.5px 36.9px; animation: team-gear 4s linear infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-team .team-person { animation: team-bob .8s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-team .team-person2 { animation-delay: .15s; }
:is(.mini-card,.revers-mini-card):hover .ico-team .team-person3 { animation-delay: .3s; }
:is(.mini-card,.revers-mini-card):hover .ico-team .team-link { stroke-dasharray: 1; animation: team-link 2s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-team .team-link2 { animation-delay: .15s; }
:is(.mini-card,.revers-mini-card):hover .ico-team .team-link3 { animation-delay: .3s; }

@media (prefers-reduced-motion: reduce) { .ico-team * { animation: none !important; } }
</style>
