<style>
@keyframes map-drop {
  0%,44%,100% { transform: none; }
  14% { transform: translateY(-8px); }
  28% { transform: translateY(0); }
  36% { transform: translateY(-2px); }
}
@keyframes map-dash { 0%,35%,100% { opacity: 1; } 12% { opacity: .15; } }

:is(.mini-card,.revers-mini-card):hover .ico-map .map-pin  { animation: map-drop 2.4s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-map .map-pin2 { animation-delay: .7s; }
:is(.mini-card,.revers-mini-card):hover .ico-map .map-pin3 { animation-delay: 1.4s; }

:is(.mini-card,.revers-mini-card):hover .ico-map .map-dash  { animation: map-dash 2.4s ease-in-out infinite; animation-delay: .2s; }
:is(.mini-card,.revers-mini-card):hover .ico-map .map-dash2 { animation-delay: .35s; }
:is(.mini-card,.revers-mini-card):hover .ico-map .map-dash3 { animation-delay: .5s; }
:is(.mini-card,.revers-mini-card):hover .ico-map .map-dash4 { animation-delay: .9s; }
:is(.mini-card,.revers-mini-card):hover .ico-map .map-dash5 { animation-delay: 1.05s; }
:is(.mini-card,.revers-mini-card):hover .ico-map .map-dash6 { animation-delay: 1.2s; }

@media (prefers-reduced-motion: reduce) { .ico-map * { animation: none !important; } }
</style>
