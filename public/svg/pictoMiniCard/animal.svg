<svg class="ico ico-lion" width="137" height="135" viewBox="0 0 137 135" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="overflow:visible">
<style>
@keyframes lion-roar {
  0%,55%,100% { transform: none; }
  18% { transform: translate(var(--tx), var(--ty)); }
  32% { transform: translate(calc(var(--tx) * .4), calc(var(--ty) * .4)); }
}
/* Mâchoire : s'ouvre puis se referme */
@keyframes lion-jaw {
  0%,55%,100% { transform: none; }
  18%,32% { transform: translateY(6px); }
}
@keyframes lion-ear-l { 0%,55%,100% { transform: none; } 15% { transform: rotate(-10deg); } 30% { transform: rotate(4deg); } }
@keyframes lion-ear-r { 0%,55%,100% { transform: none; } 15% { transform: rotate(10deg); } 30% { transform: rotate(-4deg); } }

:is(.mini-card,.revers-mini-card):hover .ico-lion .lion-m {
  animation: lion-roar 1.8s ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
:is(.mini-card,.revers-mini-card):hover .ico-lion .lion-jaw { animation: lion-jaw 1.8s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-lion .lion-ear-l { transform-origin: 38px 38px; animation: lion-ear-l 1.8s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-lion .lion-ear-r { transform-origin: 98px 38px; animation: lion-ear-r 1.8s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) { .ico-lion * { animation: none !important; } }
</style>
