<svg class="ico ico-teach" width="144" height="145" viewBox="0 0 144 145" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="overflow:visible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>

@keyframes teach-cap { 0%,100% { transform: none; } 20% { transform: translateY(-8px) rotate(-7deg); } 40% { transform: translateY(0) rotate(0); } 55% { transform: translateY(-3px) rotate(2deg); } 70% { transform: none; } }
@keyframes teach-tassel { 0%,100% { transform: none; } 25% { transform: rotate(18deg); } 50% { transform: rotate(-14deg); } 75% { transform: rotate(6deg); } }
@keyframes teach-pendulum { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-16deg); } 75% { transform: rotate(16deg); } }
:is(.mini-card,.revers-mini-card):hover .ico-teach .teach-cap { transform-origin: 72px 40px; animation: teach-cap 1.5s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-teach .teach-tassel { transform-origin: 112px 40px; animation: teach-tassel 1.5s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-teach .teach-pendulum { transform-origin: 72px 107px; animation: teach-pendulum 1.5s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) { .ico-teach * { animation: none !important; } }
</style>
