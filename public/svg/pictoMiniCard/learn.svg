<svg class="ico ico-book" width="137" height="160" viewBox="0 0 137 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="overflow:visible">
<style>
.ico-book * { transform-origin: 0 0; }

/* Rayons : s'éloignent puis reviennent */
@keyframes book-ray { 0%,100% { opacity: 1; transform: none; } 50% { opacity: .25; transform: translate(var(--tx), var(--ty)); } }
/* Ampoule : légère pulsation */
@keyframes book-bulb { 0%,100% { transform: none; } 50% { transform: scale(1.05); } }
/* Filament : scintillement */
@keyframes book-filament { 0%,100% { opacity: 1; } 30% { opacity: .2; } 60% { opacity: 1; } 80% { opacity: .4; } }
/* Pages : petit battement */
@keyframes book-page-l { 0%,100% { transform: none; } 50% { transform: translateY(-3px) rotate(-2deg); } }
@keyframes book-page-r { 0%,100% { transform: none; } 50% { transform: translateY(-3px) rotate(2deg); } }
/* Lignes de texte : se tracent une à une */
@keyframes book-line { 0% { stroke-dashoffset: 1; } 35%,80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }

:is(.mini-card,.revers-mini-card):hover .ico-book .book-ray { animation: book-ray .9s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-book .book-ray2 { animation-delay: .1s; }
:is(.mini-card,.revers-mini-card):hover .ico-book .book-ray3 { animation-delay: .2s; }
:is(.mini-card,.revers-mini-card):hover .ico-book .book-ray4 { animation-delay: .3s; }
:is(.mini-card,.revers-mini-card):hover .ico-book .book-ray5 { animation-delay: .4s; }

:is(.mini-card,.revers-mini-card):hover .ico-book .book-bulb { transform-origin: 68px 45px; animation: book-bulb .9s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-book .book-filament { animation: book-filament 1.2s ease-in-out infinite; }

:is(.mini-card,.revers-mini-card):hover .ico-book .book-page-l { transform-origin: 18px 76.5px; animation: book-page-l 1.2s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-book .book-page-r { transform-origin: 118.5px 76.5px; animation: book-page-r 1.2s ease-in-out infinite; }

:is(.mini-card,.revers-mini-card):hover .ico-book .book-line { stroke-dasharray: 1; animation: book-line 2s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-book .book-line2 { animation-delay: .15s; }
:is(.mini-card,.revers-mini-card):hover .ico-book .book-line3 { animation-delay: .3s; }

@media (prefers-reduced-motion: reduce) { .ico-book * { animation: none !important; } }
</style>

