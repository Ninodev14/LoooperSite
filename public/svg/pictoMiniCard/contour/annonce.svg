<svg class="ico ico-annonce" width="152" height="128" viewBox="0 0 152 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="overflow:visible">
<style>
@keyframes annonce-horn { 0%,100% { transform: none; } 15% { transform: rotate(-7deg) scale(1.03); } 35% { transform: rotate(5deg) scale(1.03); } 55% { transform: rotate(-3deg); } 75% { transform: rotate(1.5deg); } }
@keyframes annonce-wave { 0% { opacity: 1; transform: none; } 55% { opacity: 0; transform: translate(var(--tx), var(--ty)); } 56% { opacity: 0; transform: none; } 100% { opacity: 1; transform: none; } }
:is(.mini-card,.revers-mini-card):hover .ico-annonce .annonce-horn { transform-origin: 62px 62px; animation: annonce-horn 1.2s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-annonce .annonce-wave { animation: annonce-wave 1.2s ease-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-annonce .annonce-wave2 { animation-delay: .12s; }
:is(.mini-card,.revers-mini-card):hover .ico-annonce .annonce-wave3 { animation-delay: .24s; }
@media (prefers-reduced-motion: reduce) { .ico-annonce * { animation: none !important; } }
</style>
