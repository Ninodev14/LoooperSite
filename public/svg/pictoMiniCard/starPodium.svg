<svg class="ico ico-starPodium" width="146" height="141" viewBox="0 0 146 141" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="overflow:visible">
<style>

@keyframes pod-star { 
  0% { transform: rotate(0deg); } 
  100% { transform: rotate(360deg); } 
}
@keyframes pod-steps { 0%,60%,100% { transform: none; } 72% { transform: scaleY(.96); } }
@keyframes pod-ray { 0%,100% { opacity: 1; transform: none; } 40% { opacity: 0; transform: translate(var(--tx), var(--ty)); } 41% { opacity: 0; transform: none; } 70% { opacity: 1; } }

/* Centre exact de l'étoile : 73px x 35.35px */
.ico-starPodium .pod-star { transform-origin: 73px 35.35px; }

:is(.mini-card,.revers-mini-card):hover .ico-starPodium .pod-star { animation: pod-star 2s linear infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-starPodium .pod-steps { transform-origin: 73px 138px; animation: pod-steps 1.5s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-starPodium .pod-ray { animation: pod-ray 1.5s ease-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-starPodium .pod-ray2, :is(.mini-card,.revers-mini-card):hover .ico-starPodium .pod-ray5 { animation-delay: .1s; }
:is(.mini-card,.revers-mini-card):hover .ico-starPodium .pod-ray3, :is(.mini-card,.revers-mini-card):hover .ico-starPodium .pod-ray6 { animation-delay: .2s; }

@media (prefers-reduced-motion: reduce) { .ico-starPodium * { animation: none !important; } }
</style>
