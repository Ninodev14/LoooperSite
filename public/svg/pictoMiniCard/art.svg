<svg class="ico ico-art" width="147" height="145" viewBox="0 0 147 145" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="overflow:visible">
<style>
@keyframes art-col { 0%,100% { transform: scaleY(1); } 30% { transform: scaleY(.12); } 65% { transform: scaleY(1); } }
@keyframes art-curl-l { 0%,100% { transform: none; } 50% { transform: rotate(-7deg); } }
@keyframes art-curl-r { 0%,100% { transform: none; } 50% { transform: rotate(7deg); } }
@keyframes art-line { 0% { stroke-dashoffset: 1; } 35%,80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }

:is(.mini-card,.revers-mini-card):hover .ico-art .art-col { transform-origin: 0 114.28px; vector-effect: non-scaling-stroke; animation: art-col 1.6s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-art .art-col2 { animation-delay: .12s; }
:is(.mini-card,.revers-mini-card):hover .ico-art .art-col3 { animation-delay: .24s; }
:is(.mini-card,.revers-mini-card):hover .ico-art .art-col4 { animation-delay: .36s; }

:is(.mini-card,.revers-mini-card):hover .ico-art .art-curl-l { transform-origin: 32.3px 25.15px; animation: art-curl-l 1.2s ease-in-out infinite; }
:is(.mini-card,.revers-mini-card):hover .ico-art .art-curl-r { transform-origin: 114.7px 25.15px; animation: art-curl-r 1.2s ease-in-out infinite; }

:is(.mini-card,.revers-mini-card):hover .ico-art .art-line { stroke-dasharray: 1; animation: art-line 2s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) { .ico-art * { animation: none !important; } }
</style>
